name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --org com.example --project-name recursive_study /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android android
          sed -i 's/sourceCompatibility = JavaVersion.VERSION_1_8/coreLibraryDesugaringEnabled true\n        sourceCompatibility = JavaVersion.VERSION_1_8/' android/app/build.gradle
          printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n' >> android/app/build.gradle
          python3 tools/patch_manifest.py android/app/src/main/AndroidManifest.xml
          python3 tools/native_alarm.py android
          sed -i 's#android:label="recursive_study"#android:label="Recursive Study"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: recursive-study-apk
          path: build/app/outputs/flutter-apk/app-release.apk
